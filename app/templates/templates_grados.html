<!DOCTYPE html>
<html>
<head>
    <title>Grados y Materias</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        h1 { color: #333; }
        ul { list-style-type: none; padding: 0; }
        li { margin: 10px 0; }
    </style>
</head>
<body>
    <h1>Lista de Grados</h1>
    <ul>
        {% for grado in grados %}
            <li>{{ grado.id }} - {{ grado.nombre }}</li>
        {% endfor %}
    </ul>
    <h1>Lista de Materias</h1>
    <ul>
        {% for materia in materias %}
            <li>{{ materia.id }} - {{ materia.nombre }} (Grado {{ materia.grado_id }})</li>
        {% endfor %}
    </ul>
</body>
</html>
