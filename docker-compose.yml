services:
  postgres-sysacad:
    image: postgres:16-alpine
    container_name: postgres-sysacad
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sysacaddb}
      POSTGRES_USER: ${POSTGRES_USER:-franco}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
    volumes:
      - sysacad_pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - sysacad
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis-sysacad:
    image: redis:7-alpine
    container_name: redis-sysacad
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - sysacad
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  sysacad-alumno:
    build: .
    container_name: sysacad-alumno
    depends_on:
      postgres-sysacad:
        condition: service_healthy
      redis-sysacad:
        condition: service_healthy
    environment:
      FLASK_CONTEXT: ${FLASK_CONTEXT:-production}
      SECRET_KEY: ${SECRET_KEY:?Falta SECRET_KEY en .env}
      SQLALCHEMY_DATABASE_URI: ${SQLALCHEMY_DATABASE_URI:?Falta SQLALCHEMY_DATABASE_URI en .env}
      REDIS_URL: ${REDIS_URL:-redis://redis-sysacad:6379/0}
    networks:
      - sysacad
    ports:
      - "${APP_PORT:-5000}:5000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sysacad.rule=PathPrefix(`/alumnos`)"
      - "traefik.http.routers.sysacad.entrypoints=web"
      - "traefik.http.services.sysacad.loadbalancer.server.port=5000"

  traefik-sysacad:
    image: traefik:v3.1
    container_name: traefik-sysacad
    command:
      - "--entrypoints.web.address=:80"
      - "--providers.docker=true"
      - "--api.dashboard=true"
    ports:
      - "${TRAEFIK_PORT:-80}:80"
      - "${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    networks:
      - sysacad
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"

networks:
  sysacad:

volumes:
  sysacad_pgdata:
